{% extends "base.html" if user else "auth_base.html" %}
{% block content %}
<div class="page-header"><h2>{{ code }}</h2></div>
<div class="card">{{ message }} <a href="{{ url_for('dashboard') }}">Back to dashboard</a></div>
{% endblock %}
{% block panel %}
<div class="auth-box"><h2>{{ code }}</h2><p class="sub">{{ message }}</p>
    <a class="btn btn-green" href="{{ url_for('login') }}">Go to login</a></div>
{% endblock %}
