{% extends "base.html" %}

{% block content %}
<div class="password-page">
    <div class="password-card">
        <div class="password-heading">
            <div class="password-icon">🔐</div>
            <h2>Change Password</h2>
            <p>Keep your Chief's Court account secure by updating your password.</p>
        </div>

        <form method="POST" class="password-form">
            <label for="current_password">Current password</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">New password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm new password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="10"
                autocomplete="new-password"
                required
            >

            <p class="password-hint">
                Use at least 8 characters. A longer, unique passphrase is recommended.
            </p>

            <button type="submit" class="btn btn-block">
                Update Password
            </button>
        </form>
    </div>
</div>

<style>
.password-page {
    max-width: 520px;
    margin: 35px auto;
    padding: 0 16px;
}

.password-card {
    padding: 30px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .07);
}

.password-heading {
    text-align: center;
    margin-bottom: 28px;
}

.password-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.password-heading h2 {
    margin: 0 0 10px;
}

.password-heading p,
.password-hint {
    color: #64748b;
    font-size: .9rem;
    line-height: 1.5;
}

.password-form label {
    display: block;
    margin: 16px 0 7px;
    font-weight: 600;
}

.password-form input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font: inherit;
}

.password-form input:focus {
    outline: 2px solid #2563eb;
    outline-offset: 1px;
    border-color: #2563eb;
}

.password-hint {
    margin: 12px 0 20px;
}

.password-form button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #1d4ed8;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.password-form button:hover {
    background: #1e40af;
}

@media (max-width: 480px) {
    .password-card {
        padding: 22px 18px;
    }
}
</style>
{% endblock %}
